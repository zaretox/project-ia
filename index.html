<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Automatiser">
<meta name="theme-color" content="#E3E6E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<title>Automatiser en 12 semaines</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E6E2; --paper:#F3F4F1; --ink:#17242E; --muted:#56636C;
  --line:#C3CCD1; --grid:#A9BBC8; --accent:#E8591A; --ok:#2E7A4E; --soft:#E9ECE8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B20; --paper:#1C252C; --ink:#E6ECEF; --muted:#9AA8B2;
    --line:#33434F; --grid:#3A4D5B; --accent:#FF7A3D; --ok:#5FBF86; --soft:#222D35;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}

h1{font:700 2.6rem/0.95 var(--display);margin:6px 0 4px;letter-spacing:-.01em}
h2{font:600 1.55rem/1.1 var(--display);margin:28px 0 10px}
h3{font:600 1.15rem/1.2 var(--display);margin:18px 0 6px}
.lede{color:var(--muted);margin:0 0 18px;max-width:34em}

/* Fiche de progression : l'élément signature */
.sheet{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px}
.sheet-head{display:grid;grid-template-columns:1fr auto;border-bottom:1.5px solid var(--ink)}
.sheet-head > div{padding:8px 12px}
.sheet-head > div + div{border-left:1.5px solid var(--ink);text-align:right}
.field{font-size:.78rem;color:var(--muted);display:block}
.value{font:600 1.15rem/1.2 var(--display)}
.curve{display:block;width:100%;height:auto}
.sheet-foot{border-top:1px solid var(--line);padding:10px 12px;font-size:.92rem;color:var(--muted)}
.sheet-foot strong{color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:.82rem}
.legend span::before{content:"";display:inline-block;width:18px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend span.t::before{border-top:2px dashed var(--grid)}

.start{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:6px 10px;font-size:.88rem}
input[type=date]{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:7px 8px}

/* Semaines */
details.week{background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-bottom:8px}
details.week[open]{border-color:var(--ink)}
details.week.now{border-left:5px solid var(--accent)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:8px;padding:12px}
summary::-webkit-details-marker{display:none}
.wnum{font:700 1.5rem/1 var(--display);color:var(--muted)}
.now .wnum{color:var(--accent)}
.wtitle{font:600 1.12rem/1.15 var(--display)}
.wsub{display:block;font:400 .8rem/1.3 var(--body);color:var(--muted)}
.count{font:600 .95rem var(--display);color:var(--muted);white-space:nowrap}
.count.full{color:var(--ok)}
.wbody{padding:0 14px 16px;border-top:1px solid var(--line)}
.goal{margin:12px 0 4px;font-weight:500}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok)}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tag{display:block;font:600 .8rem var(--display);color:var(--accent);letter-spacing:.02em}
.tip{background:var(--soft);border-left:3px solid var(--ink);padding:10px 12px;margin:14px 0;font-size:.95rem}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.links a{font-size:.88rem;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:5px 9px;color:var(--ink);background:var(--bg)}
.energy{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
.energy .lbl{font-size:.9rem;color:var(--muted);margin-right:4px}
.energy button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:4px;font-weight:600;cursor:pointer}
.energy button.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:74px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:8px}

/* Ressources et routine */
.group{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:4px 14px 10px;margin-bottom:10px}
.res{padding:10px 0;border-bottom:1px dashed var(--line)}
.res:last-child{border-bottom:0}
.res a{font-weight:600;text-decoration:none}
.res p{margin:2px 0 0;font-size:.93rem;color:var(--muted)}
.prompt{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font-size:.9rem;white-space:pre-wrap;margin:6px 0}
.slot{display:grid;grid-template-columns:7.2rem 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.slot:last-child{border-bottom:0}
.slot b{font:600 1rem/1.2 var(--display)}
.slot span{font-size:.94rem}
ul.rules{margin:6px 0;padding-left:1.1em}
ul.rules li{margin:6px 0}
.danger{color:var(--muted);font-size:.88rem;margin-top:26px}

/* Clipping */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:3px;background:var(--paper)}
.stats div{padding:10px 8px;text-align:center}
.stats div + div{border-left:1.5px solid var(--ink)}
.stats .value{display:block;font-size:1.35rem}
.verdict{margin:8px 0 0;font-size:.93rem;color:var(--muted)}
.logform{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.logform label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.logform input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:7px 8px;width:100%}
.logrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.logrow:last-child{border-bottom:0}
.logrow button{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:.82rem;color:var(--muted);cursor:pointer}
.daycount{font:600 1rem var(--display);color:var(--muted);float:right}
.daycount.full{color:var(--ok)}
/* Comptes et calculateur */
.acct{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:12px 0 6px}
.acct img{width:64px;height:64px;border-radius:50%;display:block}
.acct b{font:600 1.15rem/1.15 var(--display);display:block}
.acct small{color:var(--muted)}
.bio{padding:8px 0;border-bottom:1px dashed var(--line)}
.bio:last-child{border-bottom:0}
.bio .tag{margin-bottom:3px}
.bio p{margin:0 0 6px;font-size:.93rem;white-space:pre-line}
.dl{font-size:.85rem}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.calc label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:7px 8px;width:100%}
.calcout{background:var(--soft);border-left:3px solid var(--ink);padding:10px 12px;font-size:.93rem;min-height:2.6em}
.pick{padding:10px 0;border-bottom:1px dashed var(--line)}
.pick:last-child{border-bottom:0}
.pick b{font:600 1.05rem/1.2 var(--display)}
.pill{display:inline-block;font:600 .78rem var(--display);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;color:#fff}
.pill.go{background:var(--ok)} .pill.test{background:var(--accent)} .pill.no{background:var(--muted)}
.pick p{margin:3px 0 0;font-size:.92rem;color:var(--muted)}
/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{background:none;border:0;padding:12px 2px 13px;font:600 1rem var(--display);color:var(--muted);cursor:pointer;border-top:3px solid transparent;margin-top:-1.5px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-top-color:var(--accent)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="tab-plan">
    <h1>Automatiser,<br>12 semaines</h1>
    <p class="lede">De zéro à une compétence vendable : Make, n8n, agents IA, puis tes premiers clients.</p>
    <div id="hero"></div>
    <h2>Le plan</h2>
    <div id="weeks"></div>
  </section>
  <section id="tab-res" hidden></section>
  <section id="tab-clip" hidden></section>
  <section id="tab-routine" hidden></section>
</div>

<nav class="tabs" role="tablist">

  <button role="tab" aria-selected="false" data-tab="routine">Routine</button>
</nav>

const KEY="autom12_v1";
function def(){return {start:null,done:{},energy:{},notes:{},clip:{day:"",done:{},log:[],setup:{},ana:[]}}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(def(),JSON.parse(r));}catch(e){}return def();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
if(!S.clip||!Array.isArray(S.clip.log))S.clip={day:"",done:{},log:[],setup:{}};
if(!S.clip.setup)S.clip.setup={};
if(!Array.isArray(S.clip.ana))S.clip.ana=[];

const items=w=>[...w.tasks.map((_,i)=>`t-${w.n}-${i}`),`p-${w.n}`,`d-${w.n}`];
const doneIn=w=>items(w).filter(k=>S.done[k]).length;
const TOTAL=WEEKS.reduce((a,w)=>a+items(w).length,0);
function curWeek(){
  if(!S.start)return 1;
  const d=Math.floor((Date.now()-new Date(S.start+"T00:00:00").getTime())/864e5);
  return Math.min(12,Math.max(1,Math.floor(d/7)+1));
}
function fmt(iso){const [y,m,d]=iso.split("-");return `${d}/${m}/${y}`}
function today(){const t=new Date();return new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

function curve(){
  const W=340,H=200,l=34,r=12,t=14,b=30,iw=W-l-r,ih=H-t-b;
  const cw=curWeek();
  let lastDone=0;WEEKS.forEach((w,i)=>{if(doneIn(w)>0)lastDone=i+1});
  const upto=Math.max(S.start?cw:0,lastDone);
  let cT=0,cA=0;const pT=[[l,t+ih]],pA=[[l,t+ih]];
  WEEKS.forEach((w,i)=>{
    cT+=items(w).length;cA+=doneIn(w);
    const x=l+iw*(i+1)/12;
    pT.push([x,t+ih-ih*cT/TOTAL]);
    if(i<upto)pA.push([x,t+ih-ih*cA/TOTAL]);
  });
  const path=p=>p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  let g="";
  [0,25,50,75,100].forEach(v=>{const y=t+ih-ih*v/100;
    g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="${v%50?0.5:0.9}"/>`+
       `<text x="${l-6}" y="${y+3.5}" text-anchor="end" font-size="9" fill="var(--muted)">${v}%</text>`});
  for(let i=1;i<=12;i++){const x=l+iw*i/12;
    g+=`<line x1="${x}" x2="${x}" y1="${t}" y2="${t+ih}" stroke="var(--grid)" stroke-width="0.4"/>`+
       `<text x="${x}" y="${t+ih+13}" text-anchor="middle" font-size="9" fill="${i===cw&&S.start?'var(--accent)':'var(--muted)'}" font-weight="${i===cw&&S.start?700:400}">${i}</text>`}
  g+=`<text x="${l+iw/2}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--muted)">semaines</text>`;
  const last=pA[pA.length-1];
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression : ${Math.round(100*cA/TOTAL)} % du plan validé">
    ${g}
    <path d="${path(pT)}" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="4 3"/>
    ${pA.length>1?`<path d="${path(pA)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.2" fill="var(--accent)"/>`:""}
  </svg>`;
}

function renderHero(){
  const cA=WEEKS.reduce((a,w)=>a+doneIn(w),0),pct=Math.round(100*cA/TOTAL),cw=curWeek();
  let startHtml;
  if(!S.start){
    startHtml=`<div class="start"><button class="btn" id="go">Je commence aujourd'hui</button>
      <span style="color:var(--muted);font-size:.9rem">ou choisis une date</span>
      <input type="date" id="startDate" aria-label="Date de début"></div>`;
  } else {
    startHtml=`<div class="start"><span style="color:var(--muted);font-size:.9rem">Changer la date de début</span>
      <input type="date" id="startDate" value="${S.start}" aria-label="Date de début"></div>`;
  }
  document.getElementById("hero").innerHTML=`
   <div class="sheet">
     <div class="sheet-head">
       <div><span class="field">Fiche de progression</span><span class="value">${S.start?"Début le "+fmt(S.start):"Pas encore commencé"}</span></div>
       <div><span class="field">Semaine</span><span class="value">${S.start?cw:"–"} / 12</span></div>
     </div>
     ${curve()}
     <div class="sheet-foot"><strong>${pct} % du plan validé</strong> (${cA} étapes sur ${TOTAL}).
       <div class="legend"><span>Ta courbe</span><span class="t">Rythme cible</span></div></div>
   </div>${startHtml}`;
  const go=document.getElementById("go");
  if(go)go.onclick=()=>{S.start=today();save();renderAll()};
  document.getElementById("startDate").onchange=e=>{if(e.target.value){S.start=e.target.value;save();renderAll()}};
}

function renderWeeks(){
  const cw=curWeek(),el=document.getElementById("weeks");
  const openSet=new Set([...el.querySelectorAll("details[open]")].map(d=>+d.dataset.w));
  const first=!el.dataset.init;
  el.innerHTML=WEEKS.map(w=>{
    const n=doneIn(w),tot=items(w).length,isNow=S.start&&w.n===cw;
    const open=first?(w.n===cw):openSet.has(w.n);
    const cb=(k,txt,tag)=>`<label class="check"><input type="checkbox" data-k="${k}" ${S.done[k]?"checked":""}><span>${tag?`<span class="tag">${tag}</span>`:""}${txt}</span></label>`;
    return `<details class="week${isNow?" now":""}" data-w="${w.n}" ${open?"open":""}>
      <summary><span class="wnum">${w.n}</span><span class="wtitle">${w.t}<span class="wsub">${w.s}${isNow?", cette semaine":""}</span></span>
      <span class="count${n===tot?" full":""}">${n}/${tot}</span></summary>
      <div class="wbody">
        <p class="goal">${w.g}</p>
        ${w.tasks.map((x,i)=>cb(`t-${w.n}-${i}`,x)).join("")}

  el.dataset.init="1";
  el.querySelectorAll("textarea[data-note]").forEach(t=>{t.value=S.notes[t.dataset.note]||""});
}

    const w=WEEKS.find(x=>x.n===+k.split("-")[1]);if(w&&e.target.checked&&doneIn(w)===items(w).length)toast(`Semaine ${w.n} validée`)}
});

  const n=e.target.dataset&&e.target.dataset.note;

});
document.addEventListener("click",e=>{
  const eb=e.target.closest(".energy button");
  if(eb){const w=eb.parentElement.dataset.w,v=+eb.dataset.v;S.energy[w]=S.energy[w]===v?undefined:v;if(!S.energy[w])delete S.energy[w];save();renderWeeks();return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const txt=PROMPTS[+cp.dataset.copy][1];
    const done=()=>toast("Prompt copié");
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));else fallback(txt,done);return}
  const tb=e.target.closest("nav.tabs button");
  if(tb){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b===tb));
    ["plan","res","clip","routine"].forEach(id=>document.getElementById("tab-"+id).hidden=id!==tb.dataset.tab);
    window.scrollTo(0,0)}
});
function fallback(txt,cb){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");cb()}catch(e){}a.remove()}

     ${r("opus","Repère les meilleurs moments d'une vidéo longue et les coupe en vertical. Version gratuite limitée.")}
     ${r("capcut","Finitions : sous-titres automatiques en anglais (à relire), zooms, recadrage.")}
     ${r("vyro","Une autre plateforme de campagnes, à tester une fois Whop maîtrisé.")}
     <div class="res"><b>Prompt accroches pour Claude</b><div class="prompt">${CLIP_PROMPT}</div><button class="btn ghost small" data-copyclip="1">Copier</button></div>
   </div>

   <h2>Ce qui fait les vues</h2>
   <div class="group"><ul class="rules">
     <li>Les 2 premières secondes font tout : une phrase choc, jamais d'intro.</li>
     <li>Des sous-titres gros et lisibles, centrés.</li>
     <li>Entre 20 et 45 secondes, un seul message par clip.</li>
     <li>Les chiffres honnêtes : à 1 $ les 1 000 vues, 100 € demandent environ 110 000 vues. La plupart des clips feront quelques centaines de vues, quelques-uns porteront tes gains.</li>
   </ul></div>`;
}

document.addEventListener("change",e=>{
  const ck=e.target.dataset&&e.target.dataset.ck;
  if(ck!==undefined){S.clip.done[ck]=e.target.checked;if(!e.target.checked)delete S.clip.done[ck];save();renderClip();
    if(CLIP_DAY.every((_,i)=>S.clip.done[i]))toast("Journée de clipping bouclée")}
});
document.addEventListener("click",e=>{
  if(e.target.id==="lgAdd"){
    const d=document.getElementById("lgD").value||today(),m=+document.getElementById("lgM").value||0,v=+document.getElementById("lgV").value||0,g=+document.getElementById("lgG").value||0;
    if(!m&&!v&&!g){toast("Remplis au moins un champ");return}
    S.clip.log.push({id:Date.now(),d,m,v,g});S.clip.log.sort((a,b)=>a.d<b.d?-1:1);save();renderClip();toast("Session ajoutée");return}
  const del=e.target.closest("[data-del]");
  if(del){if(confirm("Supprimer cette session ?")){S.clip.log=S.clip.log.filter(x=>String(x.id)!==del.dataset.del);save();renderClip()}return}
  const cc=e.target.closest("[data-copyclip]");
  if(cc){const done=()=>toast("Prompt copié");if(navigator.clipboard)navigator.clipboard.writeText(CLIP_PROMPT).then(done,()=>fallback(CLIP_PROMPT,done));else fallback(CLIP_PROMPT,done)}
});

function calcBurn(){
  const sp=+(document.getElementById("cbS")||{}).value||0,to=+(document.getElementById("cbT")||{}).value||0,dy=+(document.getElementById("cbD")||{}).value||0,o=document.getElementById("cbOut");
  if(!o)return;
  if(!sp||!to||!dy||sp>to){o.textContent=sp>to&&to?"Le montant dépensé dépasse le budget total.":"Remplis les 3 champs avec les chiffres de la carte.";return}
  const pct=Math.round(100*sp/to),perDay=sp/dy,left=(to-sp)/perDay;
  let v;
  if(pct>80||left<3)v="Trop tard : le budget sera épuisé avant que tes clips accumulent des vues.";
  else if(pct<20)v="Très tôt : peu de concurrence, mais vérifie que la campagne paie vraiment (tri « Highest payout »).";
  else v="Bonne fenêtre : rejoins-la si le tarif et les règles te conviennent.";
  o.textContent=`${pct} % consommé, environ ${Math.round(perDay).toLocaleString("fr-FR")} $ par jour, il reste environ ${left<1?"moins d'1":Math.round(left)} jour${left>=2?"s":""}. ${v}`;
}
document.addEventListener("input",e=>{if(["cbS","cbT","cbD"].includes(e.target.id))calcBurn()});
document.addEventListener("change",e=>{
  const st=e.target.dataset&&e.target.dataset.setup;
  if(st!==undefined){S.clip.setup[st]=e.target.checked;if(!e.target.checked)delete S.clip.setup[st];save();
    const keep=[document.getElementById("cbS")?.value,document.getElementById("cbT")?.value,document.getElementById("cbD")?.value];
    const y=window.scrollY;renderClip();["cbS","cbT","cbD"].forEach((id,i)=>{if(keep[i])document.getElementById(id).value=keep[i]});calcBurn();window.scrollTo(0,y);
    if(SETUP.every((_,i)=>S.clip.setup[i]))toast("Mise en place terminée")}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-bio]");
  if(b){const [ai,net]=b.dataset.bio.split("|");const txt=ACCOUNTS[+ai].bios[net];const done=()=>toast("Bio copiée");
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));else fallback(txt,done)}
});

function esc(t){return String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function anaSummary(list){
  const n=list.length;const ds=list.map(a=>+a.d).filter(x=>x>0).sort((a,b)=>a-b);
  const med=ds.length?ds[Math.floor(ds.length/2)]:null;
  const direct=list.filter(a=>a.s==="Moment fort direct").length;
  const top=list.slice().sort((a,b)=>(+b.v||0)-(+a.v||0))[0];
  let t=`${n} clip${n>1?"s":""} noté${n>1?"s":""}. `;
  if(med)t+=`Durée médiane : ${med} s. `;
  t+=`${direct} sur ${n} commencent directement sur le moment fort. `;
  if(top&&top.h)t+=`Meilleure accroche : « ${esc(top.h)} » (${(+top.v||0).toLocaleString("fr-FR")} vues).`;
  return t;
}
document.addEventListener("click",e=>{
  if(e.target.id==="anAdd"){
    const g=id=>document.getElementById(id).value.trim();
    const a={id:Date.now(),h:g("anH"),s:g("anS"),d:+g("anD")||0,c:g("anC"),v:+g("anV")||0};
    if(!a.h&&!a.v){toast("Note au moins l'accroche ou les vues");return}
    S.clip.ana.push(a);save();const y=window.scrollY;renderClip();try{window.scrollTo(0,y)}catch(_){}
    toast(S.clip.ana.length===20?"20 clips analysés, place aux tests":"Clip ajouté");return}
  const d=e.target.closest("[data-anadel]");
  if(d){if(confirm("Supprimer ce clip ?")){S.clip.ana=S.clip.ana.filter(x=>String(x.id)!==d.dataset.anadel);save();const y=window.scrollY;renderClip();try{window.scrollTo(0,y)}catch(_){}}}
});

renderAll();renderRes();renderClip();renderRoutine();
</script>
